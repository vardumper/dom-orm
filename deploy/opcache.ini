; ---------------------------------------------------------------------------
; DOM-ORM query cache — recommended opcache settings
;
; Merge into your web SAPI's php.ini (php-fpm / apache / nginx+php-fpm).
;
; Goal: the query cache files (cache.php + cache-index.php) are compiled once,
; served from shared memory on every request, and re-read from disk ONLY when
; they actually change.
;
; NOTE: opcache caches COMPILED SCRIPTS (opcodes), not evaluated data. For a
; whole-dataset cache file the opcache entry is roughly the size of the file
; itself (the constant pool holds every field value). That is the
; all-or-nothing in-memory model until the chunked cache lands (see
; docs/performance/roadmap.md, Phase 2). The settings below make the warm path
; correct; chunking is what makes it cheap.
; ---------------------------------------------------------------------------

opcache.enable=1

; Shared memory must hold the compiled cache files PLUS your application code.
; Budget roughly the on-disk size of cache.php + cache-index.php (2x to be
; safe). If it does not fit, opcache LRU-evicts entries and requests go cold
; again at random.
;
; GOTCHA (containers): opcache's shared memory lives in /dev/shm, which Docker
; sizes at 64 MB by default. If the segment cannot be allocated, opcache
; silently degrades and nothing gets cached. Run the container with
; --shm-size=1g (or size memory_consumption to fit the default shm).
opcache.memory_consumption=256
opcache.max_accelerated_files=20000

; max_file_size is in BYTES; the default (0) means "no limit" — the right
; setting for a monolithic cache payload. Only set it to exclude files above
; a size (in bytes) from caching.
;opcache.max_file_size=0

; "Re-read only when changed": stat the file on every require and recompile
; only when mtime/size changed.
;   revalidate_freq=0  -> stat on EVERY request (a stat() is microseconds);
;                         a rebuilt cache is visible on the very next request.
;   revalidate_freq=2  -> (PHP default) skip the stat for 2 s; a rebuilt cache
;                         can be invisible for up to 2 s.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Interned strings buffer (the cache files are string-heavy).
opcache.interned_strings_buffer=16

; --- Optional: persist compiled scripts across PHP restarts ----------------
; After a restart, workers load opcodes from this directory instead of
; recompiling (no first-request compile storm). Populate it by running
; `dom-orm warm-cache` with opcache.enable_cli=1 while this is configured
; (see docs/performance/opcache.md).
;
; file_cache_only=1 is the aggressive variant: opcache NEVER reads scripts
; from disk, only from the file cache. Not recommended while the payload is
; monolithic (it turns the file cache into the single source of truth).
;opcache.file_cache=/var/cache/php-opcache
;opcache.file_cache_only=0
