name: Deploy Demos

on:
  push:
    branches:
      - main
    paths:
      - 'demos/**'
  workflow_dispatch:
    inputs:
      remote_ip:
        description: 'Remote server IP address'
        required: true
        type: string
      remote_path:
        description: 'Remote path to deploy to'
        required: true
        type: string

jobs:
  deploy:
    name: Compress, Transfer & Extract demos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        working-directory: demos
        run: |
          # In CI we must not use the local path repository (../), because it installs
          # vardumper/dom-orm as a symlink that breaks when only demos/ is deployed.
          rm -rf vendor
          composer config --unset repositories.0 || true
          rm -f composer.lock
          composer update --no-dev --prefer-dist --optimize-autoloader

      - name: Verify demo vendor is deploy-safe
        run: |
          if [ -L demos/vendor/vardumper/dom-orm ]; then
            echo "Error: demos/vendor/vardumper/dom-orm is a symlink; deployment would break."
            exit 1
          fi

      - name: Fix directory permissions
        run: |
          find demos -type f -exec chmod 644 {} \;
          find demos -type d -exec chmod 755 {} \;

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_rsa << 'EOF'
          ${{ secrets.DEPLOY_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ inputs.remote_ip || secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Transfer and extract demos on remote server
        run: |
          tar -czf - demos/ | ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ inputs.remote_ip || secrets.DEPLOY_HOST }}" \
            "mkdir -p ${{ inputs.remote_path || secrets.DEPLOY_PATH }} && \
            cd ${{ inputs.remote_path || secrets.DEPLOY_PATH }} && \
            tar -xzf - --strip-components=1 && \
            sudo chown -R www-data:www-data . && \
            sudo find . -type f -exec chmod 644 {} \; && \
            sudo find . -type d -exec chmod 755 {} \;"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa
