name: Deploy Demos

on:
  push:
    branches:
      - main
    paths:
      - 'demos/**'
  workflow_dispatch:
    inputs:
      remote_ip:
        description: 'Remote server IP address'
        required: true
        type: string
      remote_path:
        description: 'Remote path to deploy to'
        required: true
        type: string

jobs:
  deploy:
    name: Compress, Transfer & Extract demos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        working-directory: demos
        run: |
          composer install --no-dev --optimize-autoloader

      - name: Materialize local path repository
        run: |
          if [ -L demos/vendor/vardumper/dom-orm ]; then
            source_dir="$(realpath demos/vendor/vardumper/dom-orm)"
            rm demos/vendor/vardumper/dom-orm
            mkdir -p demos/vendor/vardumper/dom-orm
            rsync -a --delete \
              --exclude .git \
              --exclude vendor \
              --exclude node_modules \
              --exclude demos \
              "$source_dir/" demos/vendor/vardumper/dom-orm/
          fi

      - name: Verify demo vendor is deploy-safe
        run: |
          if [ -L demos/vendor/vardumper/dom-orm ]; then
            echo "Error: demos/vendor/vardumper/dom-orm is a symlink; deployment would break."
            exit 1
          fi

      - name: Fix directory permissions
        run: |
          find demos -type f -exec chmod 644 {} \;
          find demos -type d -exec chmod 755 {} \;

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_rsa << 'EOF'
          ${{ secrets.DEPLOY_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ inputs.remote_ip || secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Transfer and extract demos on remote server
        run: |
          tar -czf - demos/ | ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ inputs.remote_ip || secrets.DEPLOY_HOST }}" \
            "sudo mkdir -p ${{ inputs.remote_path || secrets.DEPLOY_PATH }} && \
            sudo env TAR_OPTIONS= tar -xzf - --overwrite --strip-components=1 -C ${{ inputs.remote_path || secrets.DEPLOY_PATH }} && \
            sudo chown -R www-data:www-data ${{ inputs.remote_path || secrets.DEPLOY_PATH }} && \
            sudo find ${{ inputs.remote_path || secrets.DEPLOY_PATH }} -type f -exec chmod 644 {} \; && \
            sudo find ${{ inputs.remote_path || secrets.DEPLOY_PATH }} -type d -exec chmod 755 {} \;"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa
