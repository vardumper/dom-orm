name: Code Coverage
on:
    push:
    # only trigger if theres a change in src/ directory
        paths:
            - '.github/workflows/code-coverage.yml'
            - 'clover.xml'
    pull_request:
        paths:
            - '.github/workflows/code-coverage.yml'
            - 'clover.xml'
    workflow_dispatch:

permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # The badge is generated and committed by the pre-commit hook
      # (.githooks/pre-commit.sh) so it is part of the release commit, not a
      # post-release push. Packagist locks the source reference of a published
      # stable version, so committing the badge back to the branch after the
      # tag would move the reference and break downstream installs.
      - name: Generate code coverage badge (verification only)
        run: php bin/generate-coverage-badge.php clover.xml coverage.svg