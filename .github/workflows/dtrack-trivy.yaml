name: Workflow for Depency Track and Trivy
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    paths:
      - .github/workflows/dtrack-trivy.yml
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - .github/workflows/dtrack-trivy.yml
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          token: ${{ github.token }}

      - name: Set up php 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer self-update && composer install && composer dump-autoload -o -a

      - name: Show that Composer Lockfile exists
        run: |
          ls -lart composer.lock

      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.69.3
      - name: Create CycloneDX SBOM with Trivy
        run: trivy fs --skip-files 'vendor/rector/swiss-knife/vendor/composer/installed.json,vendor/symplify/easy-coding-standard/vendor/composer/installed.json,**/yarn.lock,**/package-lock.json,**/package.json' --format cyclonedx --include-dev-deps --output sbom.json --severity HIGH,CRITICAL,MEDIUM --scanners vuln,license,secret --debug ./

      # The SBOM is pushed to Dependency Track directly; it is no longer
      # committed back to the branch. Committing it post-release would move the
      # branch past the tag and break Packagist's stable-version immutability.
      - name: Push SBOM to Dependency Track
        run: |
          curl --fail -L -X "POST" "${{ secrets.DTRACK_API_URL }}" \
           -H "X-Api-Key: ${{ secrets.DTRACK_API_KEY }}" \
           -F "project=${{ secrets.DTRACK_PROJECT_UID }}" \
           -F "bom=@sbom.json"
